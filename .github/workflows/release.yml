name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: go.mod

      - name: verify
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -race -shuffle=on .

      - name: cross-compile
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              exe=""
              [ "$os" = windows ] && exe=".exe"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags "-s -w" \
                -o "dist/agent-go-${os}-${arch}${exe}" .
            done
          done

      - name: build .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential golang-any debhelper dh-golang
          bash .github/build-deb.sh "$GITHUB_REF_NAME"

      - name: artifact checksums
        working-directory: dist
        run: sha256sum agent-go-* agentlet_*.deb > SHA256SUMS

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
