name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  go: '1.21.x', primary: true }   # go.mod minimum floor
          - { os: ubuntu-latest,  go: 'stable',  primary: true }   # latest + coverage report
          - { os: macos-latest,   go: 'stable' }
          - { os: windows-latest, go: 'stable' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt check
        if: matrix.primary
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -o agent .

      - name: test (race + shuffle + coverage)
        run: go test -count=1 -race -shuffle=on -covermode=atomic -coverprofile=coverage.txt .

      - name: coverage summary
        if: matrix.primary && runner.os == 'Linux' && matrix.go == 'stable'
        shell: bash
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: matrix.primary && runner.os == 'Linux' && matrix.go == 'stable'
        with:
          name: coverage
          path: coverage.txt

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o /dev/null .
