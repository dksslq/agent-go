name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: gofmt check
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -o agent .

      - name: PTY input regression tests (real /dev/ptmx)
        run: go test -v -count=1 .

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o /dev/null .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential golang-any debhelper dh-golang lintian

      - name: build .deb
        run: |
          N=$(dpkg-parsechangelog -S Source)
          V=$(dpkg-parsechangelog -S Version)
          git archive HEAD --prefix "${N}-${V%%-*}/" | tar -x -C /tmp
          tar -C /tmp -czf "/tmp/${N}_${V%%-*}.orig.tar.gz" "${N}-${V%%-*}"
          (cd "/tmp/${N}-${V%%-*}" && dpkg-buildpackage -us -uc -b)
          dpkg-deb -I /tmp/${N}_${V}_amd64.deb
          dpkg-deb -c /tmp/${N}_${V}_amd64.deb

      - name: lintian
        run: N=$(dpkg-parsechangelog -S Source); lintian --fail-on error /tmp/${N}_*_amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: agentlet-deb
          path: /tmp/agentlet_*_amd64.deb
