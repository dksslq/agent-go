name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  go: '1.21.x', primary: true }   # go.mod minimum floor
          - { os: ubuntu-latest,  go: 'stable',  primary: true }   # latest + coverage report
          - { os: macos-latest,   go: 'stable' }
          - { os: windows-latest, go: 'stable' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod

      - name: gofmt check
        if: matrix.primary
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -o agent .

      - name: test (race + shuffle + coverage)
        shell: bash
        run: |
          set +e
          go test -count=1 -race -shuffle=on -covermode=atomic -coverprofile=coverage.txt . > test-output.txt 2>&1
          test_status=$?
          set -e
          cat test-output.txt
          if [ "$test_status" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *---\ FAIL:*|*.go:*) printf '::error::%s\n' "${line//%/%25}" ;;
              esac
            done < test-output.txt
          fi
          exit "$test_status"

      - name: coverage summary
        if: matrix.primary && runner.os == 'Linux' && matrix.go == 'stable'
        shell: bash
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: matrix.primary && runner.os == 'Linux' && matrix.go == 'stable'
        with:
          name: coverage
          path: coverage.txt

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: go.mod

      - name: build and inspect Debian package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential golang-any debhelper dh-golang
          bash .github/build-deb.sh
          dpkg-deb --info dist/agentlet_*.deb
          dpkg-deb --extract dist/agentlet_*.deb /tmp/agent-go-installed
          /tmp/agent-go-installed/usr/bin/agentlet -h

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: go.mod

      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o /dev/null .
